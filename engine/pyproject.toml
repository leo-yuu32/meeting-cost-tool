[project]
name = "meeting-cost"
version = "0.1.0"
description = "Focus-time cost model for meeting scheduling (Markel intern project, phase 1)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
